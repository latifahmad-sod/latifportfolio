<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=2.0">
    <title>Latif Ahmad's Projects</title>
    <style>
        /* ----- RESET & FULL-PAGE SETUP ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0a1a2f;      /* deep dark blue */
            min-height: 100vh;
            width: 100%;
            display: flex;
            flex-direction: column;          /* stack from top */
            align-items: center;             /* horizontal centering */
            padding: 2rem 1.5rem 4rem;
            font-family: system-ui, 'Segoe UI', Roboto, sans-serif;
            /* no vertical centering — content starts from top */
            justify-content: flex-start;
        }

        /* main container – full width, no card/box */
        .main-wrapper {
            width: 100%;
            max-width: 820px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;                    /* space between h1 and buttons */
        }

        /* ----- HEADING (top, centered) ----- */
        h1 {
            font-size: clamp(2.4rem, 12vw, 4.2rem);
            font-weight: 700;
            letter-spacing: 0.02em;
            color: #f0eaff;
            text-shadow: 0 4px 16px rgba(90, 40, 160, 0.6), 0 0 0 1px rgba(200, 160, 255, 0.15);
            text-align: center;
            margin: 0.2rem 0 0.8rem 0;
            padding: 0 0.5rem;
            line-height: 1.2;
            word-break: break-word;
            border-bottom: 3px solid #7b4d9e;
            padding-bottom: 0.4rem;
            display: inline-block;           /* border fits text */
            width: auto;
        }

        /* ----- BUTTON STACK — exactly one per line, horizontally centred ----- */
        .button-stack {
            display: flex;
            flex-direction: column;          /* vertical stack */
            align-items: center;             /* each button centred */
            gap: 1.4rem;                    /* space between buttons */
            width: 100%;
            margin-top: 0.5rem;
        }

        /* ----- PURPLE THEME BUTTON (exact hyperlink behaviour) ----- */
        .purple-btn {
            display: inline-block;
            background: #6a2b9e;
            background-image: radial-gradient(circle at 20% 28%, #a56ad8, #5b1f8a);
            border: none;
            border-radius: 60px;
            padding: 0.95rem 2.6rem;
            font-size: 1.35rem;
            font-weight: 600;
            color: #f5edff;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.45);
            box-shadow: 0 8px 0 #3f1366, 0 12px 24px rgba(0, 0, 0, 0.6);
            cursor: pointer;
            transition: all 0.12s ease-in;
            letter-spacing: 0.4px;
            text-align: center;
            min-width: 180px;
            width: auto;
            max-width: 360px;
            border: 1px solid rgba(215, 175, 255, 0.25);
            backdrop-filter: blur(2px);
            font-family: inherit;
            /* ensures the button behaves like a block in the stack */
            flex-shrink: 0;
        }

        /* hover + active – still purple themed */
        .purple-btn:hover {
            transform: translateY(-4px);
            background: #7b3bb5;
            background-image: radial-gradient(circle at 25% 32%, #b885e8, #642b92);
            box-shadow: 0 10px 0 #471a62, 0 18px 32px rgba(80, 20, 130, 0.7);
            border-color: rgba(220, 180, 255, 0.5);
        }

        .purple-btn:active {
            transform: translateY(5px);
            box-shadow: 0 4px 0 #3d1358, 0 8px 16px rgba(0, 0, 0, 0.6);
            transition-duration: 0.04s;
        }

        /* remove default button styling */
        .purple-btn {
            cursor: pointer;
        }

        /* ----- RESPONSIVE: smaller screens ----- */
        @media (max-width: 500px) {
            body {
                padding: 1.5rem 1rem 3rem;
            }
            .purple-btn {
                min-width: 150px;
                padding: 0.8rem 1.8rem;
                font-size: 1.15rem;
                max-width: 300px;
                width: 100%;
            }
            .button-stack {
                gap: 1.2rem;
            }
            h1 {
                font-size: clamp(1.9rem, 10vw, 3rem);
            }
        }

        /* for very large screens, keep buttons readable */
        @media (min-width: 900px) {
            .purple-btn {
                padding: 1.1rem 3.2rem;
                font-size: 1.5rem;
                min-width: 220px;
                max-width: 400px;
            }
            .button-stack {
                gap: 1.8rem;
            }
        }

        /* ----- (optional) extra polish: no box, no card ----- */
        .main-wrapper {
            background: transparent;   /* no background card */
            box-shadow: none;
            backdrop-filter: none;
            border-radius: 0;
            padding: 0;
        }

        /* just a tiny spacer to keep heading from touching top edge */
        .top-spacer {
            height: 0.2rem;
        }

        /* LINE NUMBERS (for hyper reference editing) 
           each button is clearly numbered in the HTML comments below */
    </style>
</head>
<body>
    <div class="main-wrapper">

        <!-- top spacer (tiny) -->
        <div class="top-spacer"></div>

        <!-- H1 – exactly as requested -->
        <h1>LATIF AHMAD'S PROJECTS</h1>

        <!-- BUTTON STACK – five buttons, each on its own line, horizontally centered -->
        <div class="button-stack">

            <!-- ===== LINE 1 (button 1) ===== -->
            <!-- 👉 change the hyperlink inside onclick="location.href='...' " -->
            <button class="purple-btn" onclick="location.href='wedcard.pdf'">WEDDING CARD DESIGN</button>

            <!-- ===== LINE 2 (button 2) ===== -->
            <!-- 👉 change the hyperlink inside onclick="location.href='...' " -->
            <button class="purple-btn" onclick="location.href='vcard.pdf'">BUSINESS VISITING CARD DESIGN</button>

            <!-- ===== LINE 3 (button 3) ===== -->
            <!-- 👉 change the hyperlink inside onclick="location.href='...' " -->
            <button class="purple-btn" onclick="location.href='poster.pdf'">POSTER DESIGN</button>

            <!-- ===== LINE 4 (button 4) ===== -->
            <!-- 👉 change the hyperlink inside onclick="location.href='...' " -->
            <button class="purple-btn" onclick="location.href='id.pdf'">ID CARD DESIGN</button>

            <!-- ===== LINE 5 (button 5) ===== -->
            <!-- 👉 change the hyperlink inside onclick="location.href='...' " -->
            <button class="purple-btn" onclick="location.href='file.pdf'">HOSPITAL FILE DESIGN</button>

        </div>
        <!-- end .button-stack -->

        <!-- small note: all buttons are purple themed, no box/card, 
             content starts from top, each button on its own line, 
             horizontally centred.  -->
    </div>
    <!-- end .main-wrapper -->
</body>
</html>

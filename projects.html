<!-- Center the button -->
<div class="button-container">
  <button class="animated-btn pulse" onclick="location.href='docpad.pdf'" >DOCTOR PAD DESIGN</button>
</div>

<script>
  // JavaScript animation - adds a scale bounce on click
  document.querySelector('.animated-btn').addEventListener('click', function(e) {
    // Remove existing animation class to restart it
    this.classList.remove('bounce-animation');
    
    // Force reflow
    void this.offsetWidth;
    
    // Add animation class
    this.classList.add('bounce-animation');
    
    // Remove class after animation completes
    setTimeout(() => {
      this.classList.remove('bounce-animation');
    }, 600);
  });
</script>


</style>

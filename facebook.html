<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>latif ahmad's projects</title>
<style>
	body{
		background: purple;
	}
/* Container to center the button */
.button-container {
    display: flex;
    justify-content: center;
    align-items: center;
    width: 100%;
    padding: 20px 0;
}

/* Your blue button */
.btn-blue {
    background-color: #007bff;        /* Primary blue */
    color: white;
    border: none;
    border-radius: 8px;
    padding: 15px 40px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    text-align: center;
    transition: background-color 0.3s, transform 0.2s;
    width: auto;                      /* Adjusts to content */
    max-width: 90%;                   /* Prevents overflow on small screens */
    white-space: nowrap;              /* Keeps text on one line */
}

/* Hover effect */
.btn-blue:hover {
    background-color: #0056b3;        /* Darker blue on hover */
    transform: scale(1.05);
}

/* Active/click effect */
.btn-blue:active {
    transform: scale(0.95);
}

/* Responsive: Adjust for small screens */
@media (max-width: 600px) {
    .btn-blue {
        padding: 12px 25px;           /* Smaller padding on mobile */
        font-size: 16px;              /* Smaller font on mobile */
        width: 80%;                   /* Wider button on mobile */
        white-space: normal;          /* Allow text to wrap if needed */
    }
}

/* Responsive: Very small screens */
@media (max-width: 400px) {
    .btn-blue {
        padding: 10px 20px;
        font-size: 14px;
        width: 90%;
    }
}
	
	
</style>
	
</head>
<body>
<button class="btn btn-png" onclick="window.location.href='ssc annual 1 result.png'">
    SSC RESULT OF LATIF AHMAD
</button>

	
</body>
</html>

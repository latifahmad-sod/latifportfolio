<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>latif ahmad's projects </title>
    <style>
        /* Reset default styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Full page with purple background */
        body {
            font-family: Arial, sans-serif;
            background-color: #6a0dad;  /* Purple background */
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Container to center the button */
        .button-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        /* Dark blue button */
        .btn-darkblue {
            background-color: #1a237e;  /* Dark blue */
            color: white;
            border: none;
            border-radius: 10px;
            padding: 18px 50px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            transition: background-color 0.3s, transform 0.2s, box-shadow 0.3s;
            width: auto;
            max-width: 90%;
            white-space: nowrap;
            box-shadow: 0 6px 20px rgba(26, 35, 126, 0.5);
            letter-spacing: 1px;
        }

        /* Hover effect */
        .btn-darkblue:hover {
            background-color: #0d1445;  /* Even darker blue */
            transform: scale(1.08);
            box-shadow: 0 8px 30px rgba(26, 35, 126, 0.7);
        }

        /* Active/click effect */
        .btn-darkblue:active {
            transform: scale(0.95);
            box-shadow: 0 3px 10px rgba(26, 35, 126, 0.3);
        }

        /* ============================================ */
        /* RESPONSIVE DESIGN - All screen sizes          */
        /* ============================================ */

        /* Large screens (desktops, 1200px and above) */
        @media (min-width: 1200px) {
            .btn-darkblue {
                padding: 20px 60px;
                font-size: 22px;
                border-radius: 12px;
            }
        }

        /* Medium screens (tablets, 769px to 1199px) */
        @media (max-width: 1199px) and (min-width: 769px) {
            .btn-darkblue {
                padding: 18px 50px;
                font-size: 20px;
                width: 60%;
                white-space: normal;
            }
        }

        /* Small screens (tablets/phones, 601px to 768px) */
        @media (max-width: 768px) {
            .btn-darkblue {
                padding: 16px 40px;
                font-size: 18px;
                width: 70%;
                white-space: normal;
                border-radius: 9px;
            }
        }

        /* Mobile phones (401px to 600px) */
        @media (max-width: 600px) {
            .btn-darkblue {
                padding: 14px 30px;
                font-size: 16px;
                width: 80%;
                white-space: normal;
                border-radius: 8px;
            }
        }

        /* Very small phones (400px and below) */
        @media (max-width: 400px) {
            .btn-darkblue {
                padding: 12px 20px;
                font-size: 14px;
                width: 92%;
                white-space: normal;
                border-radius: 7px;
                letter-spacing: 0.5px;
            }
        }

        /* Extra small devices (below 320px) */
        @media (max-width: 320px) {
            .btn-darkblue {
                padding: 10px 15px;
                font-size: 12px;
                width: 95%;
                border-radius: 6px;
            }
        }
    </style>
</head>
